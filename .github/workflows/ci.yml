name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'

jobs:
  verify:
    name: Maven verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
