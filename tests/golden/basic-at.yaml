name: basic-at-ok
profile: acceptance-sierra-hl6-hl8-ready
commandTerminator: CR
responseTerminator: CRLF
defaultEcho: false
defaultVerbose: true
defaultQuiet: false
clockMode: virtual
sessionSeed: 12345
serialLine:
  baudRate: 115200
  dataBits: 8
  stopBits: 1
  parity: NONE
  flowControl: NONE
metadata:
  purpose: Golden Transcript loader smoke fixture for A31.
steps:
  - inputHex: "41540D"
    outputHex: "0D0A4F4B0D0A"
expectEvents:
  - eventType: RX_BYTES
    source: rx
    direction: DTE_TO_DCE
  - eventType: PARSED_COMMAND
    source: internal
    command: AT
  - eventType: HANDLER_RESULT
    source: internal
    finalResult: OK
  - eventType: TX_BYTES
    source: tx
    direction: DCE_TO_DTE
